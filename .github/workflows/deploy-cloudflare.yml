name: Cloudflare 배포
# main에 올라온 사이트 파일을 Cloudflare Workers(정적 파일)로 올려요
# - 직접 커밋 · PR 병합: push 이벤트
# - 시세 봇 커밋: 봇의 push는 다른 워크플로를 깨우지 않아서, 시세 갱신이 끝나면(workflow_run) 따로 배포해요
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['경매장 시세 갱신']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 확인
        id: chk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 시크릿이 없어서 배포를 건너뛰어요"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
        with:
          ref: main
      - name: wrangler deploy
        if: steps.chk.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
