name: 경매장 시세 갱신
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: NEXON Open API 호출
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/fetch-prices.mjs
      - name: 변경 시 커밋
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "경매장 시세 갱신"
          # 실행 중에 다른 커밋(PR 병합 등)이 올라오면 push가 거절되므로 최신 브랜치 위에 다시 얹어서 최대 3번 시도
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
