name: 경매장 시세 갱신
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: NEXON Open API 호출
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: node scripts/fetch-prices.mjs
      - name: 변경 시 커밋
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "경매장 시세 갱신"
          git push
